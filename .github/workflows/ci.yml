name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: 'npm' }

      - name: Install dependencies
        run: npm ci
      - name: Run linting
        run: npm run lint

      - name: Start MongoDB
        run: |
          docker run -d -p 27017:27017 \
            --name mongodb-test \
            mongo:6
          sleep 15
          docker exec mongodb-test mongosh --eval "db.adminCommand('ismaster')"

      - name: Run tests
        env:
          MONGO_TEST_URI: mongodb://localhost:27017/testdb
          NODE_ENV: test

        run: npm run test:all
