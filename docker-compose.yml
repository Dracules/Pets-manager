services:
  app:
    build: .
    ports:
      - '3000:3000'
    env_file:
      - .env
      - .env.docker
    depends_on:
      - mongo

  mongo:
    image: mongo:8.0
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ADMIN_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ADMIN_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGODB_DB}

      MONGO_APP_USER: ${MONGODB_USER}
      MONGO_APP_PASSWORD: ${MONGODB_PASSWORD}

      MONGO_USERS_ADMIN_LOGIN: ${MONGODB_USERS_ADMIN_LOGIN}
      MONGO_USERS_ADMIN_PASSWORD_HASH: ${MONGODB_USERS_ADMIN_PASSWORD_HASH}
      MONGO_USERS_USER_LOGIN: ${MONGODB_USERS_USER_LOGIN}
      MONGO_USERS_USER_PASSWORD_HASH: ${MONGODB_USERS_USER_PASSWORD_HASH}
    volumes:
      - mongo_data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro

volumes:
  mongo_data:
